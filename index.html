<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Breakout Interactive Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="map"></div>

  <button id="open-filters-btn" class="floating-btn">Карта и Фильтры</button>

  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2>Карта и Фильтры</h2>
      <button id="close-sidebar-btn" class="close-btn">&times;</button>
    </div>

    <div class="sidebar-content">
      <div class="section-title">ВЫБОР КАРТЫ</div>
      <div class="map-cards-grid">
        <div class="map-card active" data-map="farm">
          <img src="map/farm.jpg" alt="Ферма">
          <span class="map-card-title">Ферма</span>
        </div>
        <div class="map-card" data-map="valley">
          <img src="map/valley.jpg" alt="Долина">
          <span class="map-card-title">Долина</span>
        </div>
        <div class="map-card" data-map="northridge">
          <img src="map/northridge.jpg" alt="Нортридж">
          <span class="map-card-title">Нортридж</span>
        </div>
        <div class="map-card" data-map="port">
          <img src="map/port.jpg" alt="Порт">
          <span class="map-card-title">Порт</span>
        </div>
        <div class="map-card" data-map="armory">
          <img src="map/armory.jpg" alt="Арсенал">
          <span class="map-card-title">Арсенал</span>
        </div>
        <div class="map-card" data-map="tv">
          <img src="map/tv_1f.jpg" alt="ТВ">
          <span class="map-card-title">ТВ</span>
        </div>
      </div>

      <div id="armory-floors" class="floor-selector" style="display: none;">
        <button class="floor-btn" data-map="armory_b1">Подвал</button>
        <button class="floor-btn" data-map="armory_1f">1 Этаж</button>
        <button class="floor-btn" data-map="armory_2f">2 Этаж</button>
      </div>

      <div id="telecenter-floors" class="floor-selector" style="display: none;">
        <button class="floor-btn" data-map="tv_1f">1 Этаж</button>
        <button class="floor-btn" data-map="tv_2f">2 Этаж</button>
      </div>

      <div class="section-title" style="margin-top: 15px;">ПОИСК ФИЛЬТРОВ</div>
      <input type="text" id="filter-search" placeholder="Поиск категории...">

      <div class="section-title" style="margin-top: 15px;">КАТЕГОРИИ</div>
      <div id="category-tree"></div>

      <div class="add-marker-container" style="margin-top: 20px;">
        <div id="toggle-add-marker" class="cat-card" style="margin-bottom: 0;">
          <span>Добавить метку</span>
          <span id="add-marker-arrow" style="transition: transform 0.2s;">›</span>
        </div>

        <div id="add-marker-section" class="collapsible-content">
          <input type="text" id="marker-title" placeholder="Название метки">
          <input type="text" id="marker-coords" placeholder="Координаты (кликните по карте)" readonly>
          <textarea id="marker-desc" placeholder="Описание" rows="3"></textarea>
          
          <input type="text" id="marker-media" placeholder="Ссылка на фото/видео (URL)">

          <label for="marker-image-file" class="file-input-label">
            <span id="image-file-label-text">🖼️ Загрузить изображение</span>
            <input type="file" id="marker-image-file" accept="image/*">
          </label>

          <label for="marker-video-file" class="file-input-label">
            <span id="video-file-label-text">🎥 Загрузить видео</span>
            <input type="file" id="marker-video-file" accept="video/*">
          </label>

          <div class="custom-select-box" id="category-select">
            <div class="selected-option" id="category-selected">Лут</div>
            <div class="options-container" id="category-options">
              <div class="custom-option selected" data-value="loot">Лут</div>
              <div class="custom-option" data-value="key">Закрытые комнаты</div>
              <div class="custom-option" data-value="extract">Точки эвакуации</div>
              <div class="custom-option" data-value="spawn">Точки появления</div>
              <div class="custom-option" data-value="interact">Объекты взаимодействия</div>
              <div class="custom-option" data-value="quest">Задания</div>
            </div>
          </div>

          <div class="custom-select-box" id="subcategory-select">
            <div class="selected-option" id="subcategory-selected">Ценный</div>
            <div class="options-container" id="subcategory-options"></div>
          </div>

          <div class="custom-select-box" id="icon-select">
            <div class="selected-option" id="icon-selected">
              <span>Без иконки</span>
            </div>
            <div class="options-container icon-options-grid" id="icon-options"></div>
          </div>

          <button id="add-marker-btn" class="action-btn">Добавить на карту</button>
          <button id="cancel-edit-btn" class="action-btn secondary" style="display: none; margin-bottom: 8px;">Отменить редактирование</button>
          <button id="save-json-btn" class="action-btn secondary">Сохранить markers.json</button>
        </div>
      </div>
    </div>
  </div>

  <div id="custom-popup-overlay" class="custom-popup-overlay">
    <div class="custom-popup-card">
      <button id="custom-popup-close" class="custom-popup-close">&times;</button>
      <div id="custom-popup-body"></div>
    </div>
  </div>

  <div id="confirm-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="section-title" style="margin-bottom: 12px; font-size: 14px;">Удаление метки</div>
      <p style="font-size: 13px; color: #ccc; margin-bottom: 15px;">Вы действительно хотите удалить эту метку?</p>
      <div class="modal-actions">
        <button id="cancel-delete-btn" class="action-btn secondary">Отмена</button>
        <button id="confirm-delete-btn" class="action-btn" style="background: #dc2626;">Удалить</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
